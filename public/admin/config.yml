backend:
  name: git-gateway
  branch: main

# Для локальної розробки: запустіть `npx decap-server` і розкоментуйте рядок нижче
# local_backend: true

# Чернетки. Без цього кожне збереження одразу публікувалося на сайт —
# не було як підготувати матеріал заздалегідь чи показати комусь перед виходом.
publish_mode: editorial_workflow

locale: uk

# Медіатека Decap плоска — показує лише файли безпосередньо в цій теці.
# Ширший корінь (public/images) дав би порожній список, бо всі 1937 фото
# лежать у вкладених теках, а нові завантаження засмічували б корінь.
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ─────────────── НОВИНИ ───────────────
  - name: news
    label: Новини
    label_singular: Новина
    description: Публікації Центру. Найновіші показуються на головній сторінці.
    folder: content/news
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    # Тільки масив: об'єктна форма з default-сортуванням, яку показує
    # документація Decap, у версії 3.15 валідацію не проходить —
    # «'collections[0].sortable_fields' must be array», і адмінка не відкриється.
    # Тож найновіші вгорі редактор ставить сам через «Сортувати за».
    sortable_fields: [date, title]
    # Лапки у фільтрі мусять бути одинарними: Decap шукає рівно date('...'),
    # з подвійними фільтр не спрацьовує і в списку видно «2021-12-16T12:28:00.000Z».
    summary: "{{date | date('DD.MM.YYYY')}} — {{title}}"
    identifier_field: title
    # 331 новина плоским списком — без групування знайти щось важко.
    view_groups:
      - { label: Рік, field: date, pattern: '\d{4}' }
    view_filters:
      - { label: 2026 рік, field: date, pattern: '^2026' }
      - { label: 2025 рік, field: date, pattern: '^2025' }
      - { label: 2024 рік, field: date, pattern: '^2024' }
    fields:
      # Порядок полів — це порядок, у якому їх заповнюють: спочатку про що
      # новина, потім сам текст, потім фото. Службове — наприкінці, згорнуте.
      - { name: title, label: Заголовок, widget: string }
      - name: date
        label: Дата публікації
        widget: datetime
        # format задає, ЯК дата лягає у файл, а date_format/time_format —
        # лише як вона виглядає в календарику. Без format Decap може
        # записати «26.07.2026T10:00», а сайт читає дату через new Date():
        # на такому значенні збірка падає з RangeError і деплой не проходить.
        format: YYYY-MM-DDTHH:mm:ss.SSSZ
        date_format: DD.MM.YYYY
        time_format: HH:mm
        hint: Від неї залежить порядок у стрічці та рік в архіві
      - name: body
        label: Текст новини
        widget: markdown
      - name: author
        label: Підпис
        widget: text
        required: false
        hint: 'Хто підготував: наприклад «Консультант ЦПРПП Світлана ЛІСНА». Показується під текстом.'
      - name: gallery
        label: Фотогалерея
        widget: list
        required: false
        label_singular: Фото
        summary: '{{fields.image}}'
        hint: Порядок фото можна змінювати перетягуванням. Підпис не обов'язковий.
        fields:
          - { name: image, label: Зображення, widget: image }
          - { name: caption, label: Підпис, widget: string, required: false }
      - name: cover
        label: Головне зображення
        widget: image
        required: false
        hint: Показується на картці новини. Якщо не вибрати — візьметься перше фото з галереї.
      - name: topics
        label: Теми
        widget: select
        multiple: true
        required: false
        hint: 'Публікація сама з''явиться в списку «Події» на відповідній сторінці — заходити на ту сторінку й додавати посилання не треба.'
        options:
          - { label: Атестація, value: atestatsiia }
          - { label: Дошкілля, value: doshkillia }
          - { label: Інклюзивна освіта, value: inkliuzyvna-osvita }
          - { label: Початкова школа, value: pochatkova-shkola }
          - { label: Сертифікація педагогічних працівників, value: sertyfikatsiia-pedahohichnykh-pratsivnykiv }
          - { label: Шкільна бібліотека, value: shkilna-biblioteka }
          - { label: Соціально-психологічна служба, value: sotsialno-psykholohichna-sluzhba }
          - { label: Сторінка психолога, value: storinka-psykholoha }
          - { label: Супервізія, value: superviziia }
          - { label: Творчі групи, value: tvorchi-hrupy }
          # Напрямки загальної середньої освіти: у кожного власна підсторінка
          - { label: 'ЗСО: предмети суспільно-гуманітарного напрямку', value: predmety-suspilno-humanitarnoho-napriamku }
          - { label: 'ЗСО: предмети природничо-математичного напрямку', value: predmety-pryrodnycho-matematychnoho-napriamku }
          - { label: 'ЗСО: предмети хіміко-біологічного напрямку', value: predmety-khimiko-biolohichnoho-napriamku }
          - { label: 'ЗСО: предмети художньо-естетичного напрямку', value: predmety-khudozhno-estetychnoho-napriamku }
          - { label: 'ЗСО: фізична культура, Захист України, трудове навчання', value: fizychna-kultura-zakhyst-ukrainy-trudove-navchannia }
          - { label: 'ЗСО: позаурочна робота', value: pozaurochna-robota }
      - name: description
        label: Короткий опис
        widget: text
        required: false
        collapsed: true
        hint: Показується на картці новини і в Google. Якщо лишити порожнім — візьмемо перший абзац тексту.
      - name: attachments
        label: Прикріплені файли
        widget: list
        required: false
        collapsed: true
        label_singular: Файл
        summary: '{{fields.label}}'
        hint: Для файлів, які кладете на сам сайт. Посилання на Google Диск зручніше вставляти прямо в текст.
        fields:
          - { name: label, label: Назва для показу, widget: string }
          - { name: file, label: Файл, widget: file, media_folder: /public/documents, public_folder: /documents }
      - name: seo_title
        label: Заголовок для Google
        widget: string
        required: false
        collapsed: true
        hint: Якщо порожньо — використовується звичайний заголовок. Заповнюйте лише за потреби.
      - name: seo_description
        label: Опис для Google
        widget: text
        required: false
        collapsed: true
        hint: Якщо порожньо — використовується короткий опис вище.
      # Службові мітки зі старого сайту (Березень2024 тощо). Ніде не
      # показуються, але лишаються у файлі, щоб не зникли при збереженні.
      - { name: tags, label: Теги, widget: hidden }

  # ─────────────── СТОРІНКИ ───────────────
  - name: pages
    label: Сторінки
    label_singular: Сторінка
    description: Постійні сторінки сайту. Складаються з блоків, які можна додавати й переставляти.
    folder: content/pages
    create: true
    # Імʼя файла = поле «Адреса сторінки», а не транслітерація назви: сайт будує
    # адресу з імені файла (lib/content.ts -> slugify), тож інакше адреса в меню
    # і адреса на сайті розходяться.
    slug: '{{fields.slug}}'
    identifier_field: title
    sortable_fields: [title, section]
    summary: '{{title}} — {{section}}'
    view_groups:
      - { label: Розділ, field: section }
    # Убудований перегляд не вміє показувати блоки так, як вони виглядають
    # на сайті, тож радше вводив би в оману.
    editor:
      preview: false
    fields:
      - name: title
        label: Назва сторінки
        widget: string
        hint: Показується заголовком на самій сторінці. Підпис у меню задається окремо, у «Налаштуваннях сайту» → «Головне меню».
      # Адреса сторінки. Не показуємо (складається сама з назви), але поле
      # мусить бути оголошене: інакше Decap відкине його при збереженні
      # й адреси наявних сторінок могли б змінитися.
      # Адреса сторінки задається вручну латинкою. Decap не вміє транслітерувати
      # українську: з назви «Тестова сторінка» він назвав би файл «тестова-сторінка»,
      # і адреса в меню (/тестова-сторінка) не збіглася б з адресою на сайті (/testova-storinka).
      # Усі 69 наявних сторінок уже мають це поле, тож для них нічого не змінюється.
      - name: slug
        label: Адреса сторінки
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Лише маленькі латинські літери, цифри й дефіси — напр. plany-roboty']
        hint: >-
          Латинкою, маленькими літерами, замість пробілів дефіси: напр. normatyvni-dokumenty.
          Сторінка буде за адресою site/адреса. Саме це значення вставляється в меню.
          У наявних сторінок НЕ змінюйте — зламаються посилання, які вже десь дали людям.
      - name: section
        label: Розділ меню
        widget: select
        required: false
        hint: Підпис над заголовком сторінки. Саме меню налаштовується окремо, у «Налаштуваннях сайту».
        options:
          - Про Центр
          - Головна сторінка
          - Новини Центру
          - Освіта Лубенщини в умовах воєнного стану
          - Діяльність Центру
          - Педагогічні спільноти
          - Професійний розвиток
          - Консалтингові послуги
      # Підсторінки (напрямки ЗСО тощо) не мають пункту в меню, тож на них
      # ставимо посилання «назад» до батьківського розділу. Обираємо зі
      # списку наявних сторінок, щоб не вписувати адресу руками.
      - name: parent
        label: Це підсторінка розділу
        widget: relation
        required: false
        collection: pages
        search_fields: [title]
        value_field: title
        display_fields: [title]
        hint: Лишіть порожнім для звичайної сторінки. Якщо вказати розділ, угорі з’явиться посилання «назад» до нього.
      - name: full_title
        label: Повна офіційна назва
        widget: string
        required: false
        collapsed: true
        hint: Якщо офіційна назва задовга для меню. У меню лишиться коротка, а на сторінці буде ця.

      - name: blocks
        # Decap підставляє цю назву в рядок-лічильник у нижньому регістрі,
        # тому «Вміст сторінки» читалося як «2 вміст сторінки».
        # З «Блоки сторінки» виходить «2 блоки сторінки».
        label: Блоки сторінки
        label_singular: Блок
        widget: list
        # Не обов'язкове: сторінки, які ще не перевели на блоки, мають
        # зберігатися без помилки валідації
        required: false
        hint: Додавайте блоки кнопкою нижче. Порядок можна змінювати перетягуванням.
        types:
          - name: text
            label: Текст
            summary: "{{fields.text | truncate(70)}}"
            fields:
              - name: text
                label: Текст
                widget: markdown
                hint: >-
                  Один блок — один розділ, а не один абзац. Заголовок, абзаци і списки під ним
                  пишіть в одному блоці: так у списку блоків видно назву розділу, а не десяток
                  однакових карток.

          - name: notice
            label: Оголошення
            summary: '{{fields.heading}}'
            fields:
              - { name: heading, label: Заголовок, widget: string, default: ОГОЛОШЕННЯ }
              - { name: text, label: Текст оголошення, widget: markdown }

          - name: accordion
            label: Розгортуваний розділ з текстом
            summary: "{{fields.title | default('Розгортуваний розділ')}}"
            fields:
              - { name: title, label: Заголовок розділу, widget: string, hint: 'Наприклад: Пояснення, Роз’яснення' }
              - name: text
                label: Вміст розділу
                widget: markdown
                hint: >-
                  Для суцільного тексту й пояснень. Якщо це перелік документів чи посилань —
                  краще взяти блок «Перелік документів і посилань», а для таблиці з контактами —
                  блок «Таблиця»: там кожна назва й адреса має власне поле.

          - name: news_by_topic
            label: Список новин за темою (оновлюється сам)
            summary: "{{fields.title | default('Список новин за темою')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false, default: Події }
              - name: topic
                label: Тема
                widget: select
                hint: 'Список збирається сам. Щоб додати сюди новину — відкрийте її в розділі «Новини» і поставте цю ж тему в полі «Теми». Тут вручну нічого додавати не треба.'
                options:
                  - { label: Атестація, value: atestatsiia }
                  - { label: Дошкілля, value: doshkillia }
                  - { label: Інклюзивна освіта, value: inkliuzyvna-osvita }
                  - { label: Початкова школа, value: pochatkova-shkola }
                  - { label: Сертифікація педагогічних працівників, value: sertyfikatsiia-pedahohichnykh-pratsivnykiv }
                  - { label: Шкільна бібліотека, value: shkilna-biblioteka }
                  - { label: Соціально-психологічна служба, value: sotsialno-psykholohichna-sluzhba }
                  - { label: Сторінка психолога, value: storinka-psykholoha }
                  - { label: Супервізія, value: superviziia }
                  - { label: Творчі групи, value: tvorchi-hrupy }
                  # Напрямки загальної середньої освіти. Кожен має власну
                  # підсторінку, куди цей список і збирає свої заходи.
                  - { label: 'ЗСО: предмети суспільно-гуманітарного напрямку', value: predmety-suspilno-humanitarnoho-napriamku }
                  - { label: 'ЗСО: предмети природничо-математичного напрямку', value: predmety-pryrodnycho-matematychnoho-napriamku }
                  - { label: 'ЗСО: предмети хіміко-біологічного напрямку', value: predmety-khimiko-biolohichnoho-napriamku }
                  - { label: 'ЗСО: предмети художньо-естетичного напрямку', value: predmety-khudozhno-estetychnoho-napriamku }
                  - { label: 'ЗСО: фізична культура, Захист України, трудове навчання', value: fizychna-kultura-zakhyst-ukrainy-trudove-navchannia }
                  - { label: 'ЗСО: позаурочна робота', value: pozaurochna-robota }
              - name: open
                label: Показувати список одразу
                widget: boolean
                required: false
                default: false
                hint: Якщо не позначено, список буде згорнутий і відкриється клацанням по заголовку. Позначайте на сторінках, де цей список — головний вміст.
              - name: extra
                label: Заходи без публікації на сайті
                widget: markdown
                required: false
                hint: >-
                  Назви заходів, матеріалів яких на сайті немає (не перенеслися зі старого сайту).
                  Показуються сірим списком під посиланнями з підписом «Заходи, матеріали яких не опубліковані»,
                  щоб не здавалося, ніби посилання не працюють. Якщо публікацію створено — приберіть звідси
                  рядок і поставте новині відповідну тему.

          - name: certificates
            label: Переліки виданих документів (оновлюється сам)
            summary: "{{fields.title | default('Переліки виданих документів')}}"
            fields:
              - name: title
                label: Заголовок
                widget: string
                required: false
                default: Переліки виданих документів
                hint: 'Список збирається сам із розділу «Облік сертифікатів» і групується за роками. Щоб додати перелік — створіть його там, а тут нічого вписувати не треба.'
              - name: intro
                label: Пояснення над списком
                widget: markdown
                required: false
                hint: Коротка підказка відвідувачеві, як шукати себе у переліках.
              - name: extra
                label: Заходи, переліки яких ще не опубліковані
                widget: text
                required: false
                hint: >-
                  По назві заходу на рядок. Показуються звичайним текстом, без посилань.
                  Коли створите перелік у розділі «Облік сертифікатів» — приберіть звідси цей рядок.

          # Дані місяців лежать у розділі «Плани роботи», тут лише вказівка,
          # де їх показати. Так само зроблено з переліками сертифікатів.
          - name: plans
            label: Плани роботи по місяцях (оновлюється сам)
            summary: Плани роботи по місяцях
            fields:
              - name: intro
                label: Пояснення над списком
                widget: markdown
                required: false
                hint: Необов'язково. Місяці збираються самі з розділу «Плани роботи» — тут нічого вписувати не треба.

          # Ручний список новин. Лишається доступним, хоч на жодній сторінці зараз
          # не використаний: рендер у коді є, і це єдиний спосіб зібрати добірку
          # публікацій, які не мають спільної теми.
          - name: news_list
            label: Список новин (обираються вручну)
            summary: "{{fields.title | default('Список новин')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false, default: Події }
              - name: items
                label: Новини
                label_singular: Новина
                widget: list
                summary: '{{fields.item}}'
                hint: >-
                  Оберіть публікації зі списку — назва й дата підтягнуться самі й не розійдуться
                  з новиною. Якщо потрібні всі новини однієї теми, зручніше взяти блок
                  «Список новин за темою»: він оновлюється сам.
                field:
                  name: item
                  label: Новина
                  widget: relation
                  collection: news
                  search_fields: [title]
                  value_field: '{{slug}}'
                  display_fields: ['{{title}}']

          - name: documents
            label: Перелік документів і посилань
            summary: "{{fields.title | default('Перелік документів')}}"
            hint: >-
              Для файлів, сторінок і новин, на які треба клацнути. Якщо посилань немає —
              це звичайний список: пишіть його в блоці «Текст», інакше в переліку блоків
              буде кілька однакових карток «Перелік документів».
            fields:
              - { name: title, label: Заголовок, widget: string, required: false, default: Документи }
              - name: intro
                label: Вступний абзац
                widget: markdown
                required: false
                hint: Необов'язково. Показується всередині розділу, над списком.
              - name: view
                label: Як показувати
                widget: select
                default: collapsed
                hint: Якщо не впевнені — лишіть «Згорнутий розділ».
                options:
                  - { label: Згорнутий розділ (в��дкривається клацанням), value: collapsed }
                  - { label: Одразу розкритий список, value: open }
                  - { label: Картка з рамкою (щоб привер��ути увагу), value: card }
                  - { label: Плитки (для кількох бланків), value: grid }
              # Успадковане з імпорту поле. Рендер читає його як запасний варіант
              # для `view`; без оголошення Decap стирав би його при кожному save.
              - { name: collapsed, widget: hidden, required: false }
              - name: numbered
                label: Нумерувати рядки
                widget: boolean
                default: false
                required: false
                hint: Для переліків на кшталт нормативних документів, де посилаються на номер.
              - name: items
                label: Перелік
                label_singular: Рядок
                widget: list
                summary: '{{fields.label}}'
                hint: >-
                  Один рядок — один документ. Порядок змінюється перетягуванням.
                  Посилання робити не треба: просто впишіть назву й вкладіть адресу або файл.
                fields:
                  - { name: label, label: Назва, widget: string, required: false, hint: 'Те, що побачить відвідувач' }
                  - name: url
                    label: Посилання
                    widget: string
                    required: false
                    hint: >-
                      Для сторінки сайту — коса риска й «Адреса сторінки» з її картки,
                      напр. /normatyvni-dokumenty. Можна й зовнішню адресу (Google Диск).
                      Якщо завантажуєте файл чи обираєте новину — лишіть порожнім.
                  - name: file
                    label: Або завантажити файл
                    widget: file
                    required: false
                    media_folder: /public/documents
                    public_folder: /documents
                    hint: Для файлів, які зберігаються на самому сайті. Має перевагу над посиланням вище.
                  - name: news
                    label: Або новина з цього сайту
                    widget: relation
                    required: false
                    collection: news
                    search_fields: [title]
                    value_field: '{{slug}}'
                    display_fields: ['{{title}}']
                    hint: Коли рядок веде на публікацію тут же. Оберіть її зі списку — адресу вписувати не треба.
                  - name: children
                    label: Вкладені накази й додатки
                    label_singular: Вкладений документ
                    widget: list
                    required: false
                    collapsed: true
                    summary: '{{fields.label}}'
                    hint: >-
                      Заповнюйте, коли до заходу є свої накази й додатки — вони стануть
                      підпорядкованим списком під назвою. Якщо їх немає, лишіть порожнім.
                    fields:
                      - { name: label, label: Назва, widget: string, hint: 'Наприклад: Наказ «Про проведення», Додаток 1' }
                      - { name: url, label: Посилання, widget: string, required: false }
                      - name: file
                        label: Або завантажити файл
                        widget: file
                        required: false
                        media_folder: /public/documents
                        public_folder: /documents

          - name: table
            label: Таблиця (керівники, контакти)
            summary: "{{fields.title | default('Таблиця')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false, hint: 'Наприклад: Керівники ЗДО' }
              - name: view
                label: Як показувати
                widget: select
                default: collapsed
                options:
                  - { label: Згорнутий розділ (відкривається клацанням), value: collapsed }
                  - { label: Одразу розкрита таблиця, value: open }
              - name: columns
                label: Назви стовпців
                label_singular: Стовпець
                widget: list
                required: false
                # Без summary Decap підписує згорнутий рядок лейблом поля («Назва стовпця»),
                # тож список виглядав як чотири порожні пункти. collapsed: false — щоб
                # значення були видні відразу: стовпців завжди кілька, місця вони не з'їдають.
                summary: '{{fields.column}}'
                collapsed: false
                field: { name: column, label: Назва стовпця, widget: string }
                hint: 'Необов’язково. Якщо лишити порожнім, шапка складеться з «Які дані в стовпцях» нижче, а «№ з/п» додасться сам. Заповнюйте, лише коли потрібні свої формулювання, напр.: № з/п, Назва закладу, Керівник, Телефон, Електронна адреса'
              - name: fields
                label: Які дані в стовпцях
                label_singular: Стовпець
                widget: list
                required: false
                summary: '{{fields.field}}'
                collapsed: false
                hint: 'Порядок — як у назвах стовпців вище, без «№ з/п»: його сайт нумерує сам.'
                field:
                  name: field
                  label: Дані стовпця
                  widget: select
                  options:
                    - { label: Заклад освіти, value: institution }
                    - { label: "Прізвище, ім'я, по батькові", value: person }
                    - { label: Посада / напрям роботи / спільнота, value: role }
                    - { label: Телефон, value: phone }
                    - { label: Електронна адреса, value: email }
                    - { label: Закріплені консультанти, value: consultant }
              - name: entries
                label: Рядки
                label_singular: Рядок
                widget: table_grid
                required: false
                # Без summary Decap показує рядок сирим масивом ["1","Перша гімназія…"],
                # а з ним у списку видно заклад і людину — рядок можна знайти очима.
                summary: "{{fields.institution}} {{fields.person}} {{fields.role}}{{fields.phone}}"
                hint: Заповнюйте лише ті поля, які є в цій таблиці. Пошту й телефон пишіть звичайним текстом — посилання зробляться самі.
                fields:
                  - { name: institution, label: Заклад освіти, widget: string, required: false }
                  - { name: person, label: "Прізвище, ім'я, по батькові", widget: string, required: false }
                  - { name: role, label: Посада / напрям роботи / спільнота, widget: string, required: false }
                  - { name: phone, label: Телефон, widget: string, required: false }
                  - { name: email, label: Електронна адреса, widget: string, required: false }
                  - { name: consultant, label: Закріплені консультанти, widget: string, required: false }
                  - { name: note, label: Рядок на всю ширину (підпис), widget: string, required: false }
              # Старий формат безіменних клітинок. Лишається, поки не всі сторінки
              # переведені на «Рядки»: якщо забрати це поле, адмінка стерла б
              # рядки таких таблиць під час першого ж збереження сторінки.
              - name: rows
                label: Рядки (старий формат)
                label_singular: Рядок
                widget: list
                required: false
                summary: '{{fields.cells}}'
                hint: Не заповнюйте вручну. Тут лишились таблиці, які ще не переведені на іменовані поля.
                fields:
                  - name: cells
                    label: Клітинки
                    label_singular: Клітинка
                    widget: list
                    summary: '{{fields.cell}}'
                    field: { name: cell, label: Значення, widget: string }

          - name: gallery
            label: Фотогалерея
            summary: "{{fields.title | default('Фотогалерея')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false }
              - name: images
                label: Фотографії
                label_singular: Фото
                widget: list
                summary: '{{fields.caption}}'
                fields:
                  - { name: image, label: Зображення, widget: image }
                  - { name: caption, label: Підпис, widget: string, required: false }

          - name: partners
            label: Логотипи партнерів
            summary: "{{fields.title | default('Логотипи партнерів')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false }
              - name: items
                label: Партнери
                label_singular: Партнер
                widget: list
                summary: '{{fields.name}}'
                hint: Логотипи стануть плиткою — по чотири в рядок на комп'ютері, по два на телефоні.
                fields:
                  - name: name
                    label: Назва установи
                    widget: string
                    hint: 'Потрібна, навіть якщо є логотип — її читають незрячим відвідувачам і показують, коли малюнок не завантажився.'
                  - name: image
                    label: Логотип
                    widget: image
                    required: false
                    media_folder: /public/images/pict/coop
                    public_folder: /images/pict/coop
                  - { name: url, label: Посилання на сайт установи, widget: string, required: false }

          - name: cards
            label: Картки-посилання
            summary: "{{fields.title | default('Картки-посилання')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false }
              - name: items
                label: Картки
                label_singular: Картка
                widget: list
                summary: '{{fields.label}}'
                hint: Стануть плиткою — по три в рядок на комп'ютері, по одній на телефоні.
                fields:
                  - { name: label, label: Назва, widget: string, hint: 'Наприклад: Дошкільна освіта' }
                  - name: text
                    label: Пояснення
                    widget: string
                    required: false
                    hint: Один-два рядки під назвою. Звичайний текст, без розмітки.
                  - name: url
                    label: Посилання
                    widget: string
                    required: false
                    hint: 'Сторінка сайту (/novyny) або зовнішня адреса (https://…). Без адреси картка лишиться без кліку.'
                  - name: icon
                    label: Піктограма
                    widget: select
                    required: false
                    default: link
                    options:
                      - { label: Посилання, value: link }
                      - { label: Документ, value: document }
                      - { label: Люди, value: people }
                      - { label: Календар, value: calendar }
                      - { label: Книга, value: book }
                      - { label: Телефон, value: phone }
                      - { label: Лист, value: mail }
                      - { label: Нагорода, value: award }

          - name: video
            label: Відео з YouTube
            summary: "{{fields.title | default('Відео з YouTube')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false }
              - name: url
                label: Посилання на відео
                widget: string
                hint: 'Скопіюйте адресу з YouTube як є — підходять і youtu.be/…, і watch?v=…, і /shorts/….'
              - { name: caption, label: Підпис під відео, widget: string, required: false }

          - name: steps
            label: Порядок дій (кроки)
            summary: "{{fields.title | default('Порядок дій')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false, hint: 'Наприклад: Як записатися на консультацію' }
              - name: items
                label: Кроки
                label_singular: Крок
                widget: list
                summary: '{{fields.label}}'
                hint: Номери проставляються самі — переставляйте кроки вільно.
                fields:
                  - { name: label, label: Що зробити, widget: string }
                  - { name: text, label: Пояснення, widget: string, required: false }

          - name: cta
            label: Смуга із кнопкою
            summary: "{{fields.heading | default(fields.button_label)}}"
            fields:
              - { name: heading, label: Заголовок, widget: string, required: false, hint: 'Наприклад: Потрібна консультація?' }
              - { name: text, label: Пояснення, widget: string, required: false }
              - { name: button_label, label: Надпис на кнопці, widget: string, hint: 'Наприклад: Записатися' }
              - name: url
                label: Куди веде кнопка
                widget: string
                hint: 'Сторінка сайту (/novyny), Google Форма (https://…) або tel:0536177416.'

          - name: embed
            label: Форма або мапа на сторінці
            summary: "{{fields.title | default('Форма або мапа')}}"
            fields:
              - { name: title, label: Заголовок, widget: string, required: false, hint: 'Наприклад: Запис на консультацію' }
              - name: url
                label: Посилання
                widget: string
                hint: >-
                  Повне посилання з docs.google.com, drive.google.com, calendar.google.com, google.com/maps
                  або padlet.com. Коротке forms.gle НЕ підходить — Google не дозволяє показувати його в рамці:
                  у формі натисніть «Надіслати» → «< >» і скопіюйте адресу з поля src.
                  Для мапи потрібен саме код із «Поділитися → Вбудувати карту» (адреса виду
                  google.com/maps/embed?pb=…), звичайне посилання на мапу в рамці не відкривається.
              - name: height
                label: Висота рамки
                widget: select
                required: false
                default: medium
                options:
                  - { label: Невисока (мапа, календар), value: short }
                  - { label: Середня (звичайна форма), value: medium }
                  - { label: Велика (довга форма), value: tall }
              - name: note
                label: Підпис під рамкою
                widget: string
                required: false
                hint: 'Наприклад: якщо форма не відкривається — заповніть її за посиланням.'

      # Тіло сторінки у старому форматі, до переходу на блоки. Перевірено:
      # порожнє в усіх 32 сторінках, бо весь вміст переїхав у блоки.
      #
      # Приховане навмисно. Раніше воно показувалося великим редактором
      # Markdown просто під блоками — секретар природно почав би писати в цю
      # знайому р��мку, а не в блоки, і повернувся б до тієї самої розмітки,
      # від якої ми відходили. Двох місць для тексту бути не повинно.
      #
      # Поле не видаляємо: `body` у Decap — це тіло md-файлу, і без нього
      # текст старої сторінки зникнув би при першому ж збереженні.
      # Сайт показує це тіло лише тоді, коли блоків немає (app/[slug]/page.tsx).
      - name: body
        label: Текст (старий формат)
        widget: hidden
        required: false
      - name: seo_title
        label: Заголовок для Google
        widget: string
        required: false
        collapsed: true
      - name: seo_description
        label: Опис для Google
        widget: text
        required: false
        collapsed: true

  # ─────────────── ОБЛІК СЕРТИФІКАТІВ ───────────────
  # Окрема колекція, а не блоки на сторінці: переліків уже понад п'ятдесят,
  # і кожен має власну таблицю на два десятки рядків. Сторінка «Облік
  # сертифікатів» збирає їх сама — там нічого правити не потрібно.
  - name: certificates
    label: Облік сертифікатів
    label_singular: Перелік виданих документів
    description: >-
      Переліки документів про підвищення кваліфікації. Кожен захід — окремий перелік.
      На сторінці «Облік сертифікатів» вони з’являються самі, згруповані за роками,
      і знаходяться пошуком по сайту за прізвищем або обліковим номером.
    folder: content/certificates
    create: true
    slug: '{{slug}}'
    identifier_field: title
    sortable_fields: [date, title]
    summary: '{{title}}'
    view_groups:
      - { label: Рік, field: date, pattern: '\d{4}' }
    # Убудований перегляд не вміє показувати таблицю так, як вона виглядає на сайті
    editor:
      preview: false
    fields:
      - name: title
        label: Назва переліку
        widget: string
        hint: 'Наприклад: Перелік виданих документів педагогічним працівникам ЗДО Лубенської ТГ, учасникам семінару-практикуму «…»'
      - name: date
        label: Дата заходу
        # У Decap 3 віджета `date` більше немає — лишився тільки `datetime`,
        # і на цьому полі адмінка писала «Відсутній модуль для 'date'».
        # Тому datetime без часу: format кладе у файл рівно YYYY-MM-DD, як у
        # наявних 75 переліках, а сторінка бере з нього рік через date.slice(0, 4).
        widget: datetime
        required: false
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY
        time_format: false
        hint: За нею перелік потрапляє у свій рік на сторінці. Найновіші показуються вгорі.
      - name: event
        label: Підпис про захід
        widget: string
        required: false
        hint: 'Як було на старому сайті: «22 березня 2024 року». Показується під назвою.'

      # ─── Значення на весь захід ───
      # Форма, обсяг і результат усередині одного семінару майже завжди спільні
      # (перевірено на 1569 записах: лише ~23% рядків від них відрізняються).
      # Тому вони задаються тут один раз, а в записі лишається тільки виняток.
      - name: default_form
        label: Форма проходження — на весь захід
        widget: select
        required: false
        default: Офлайн
        options:
          - Офлайн
          - Онлайн
          - Змішана (онлайн + офлайн)
        hint: Підставиться всім слухачам. Якщо в когось інакше — вкажіть це в його рядку.
      - name: default_volume
        label: Обсяг — на весь захід
        widget: string
        required: false
        hint: 'Наприклад: 30 год. (1 кредит ЄКТС). Підставиться всім слухачам.'
      - name: default_result
        label: Результат — на весь захід
        widget: text
        required: false
        hint: 'Наприклад: Удосконалення професійно-педагогічної компетентності. Підставиться всім слухачам.'

      # ─── Слухачі ───
      # Раніше тут були два окремі списки: «Назви стовпців» і «Рядки» з
      # безіменними клітинками. В адмінці це виглядало як сім однакових
      # згорнутих рядків «Назва стовпця», а порядок клітинок редактор мусив
      # тримати синхронним зі стовпцями вручну. Тепер поля названі, порядок
      # стовпців гарантує код, а номер рахується з позиції.
      - name: entries
        label: Слухачі
        label_singular: Слухач
        widget: list
        summary: '{{fields.name}} — {{fields.record}}'
        hint: >-
          Один рядок — один слухач. Номер у таблиці ставиться сам, вписувати
          його не треба. Порядок змінюється перетягуванням.
        fields:
          - name: name
            label: Прізвище, ім'я, по батькові
            widget: string
            hint: Повністю, як у документі.
          - name: record
            label: Обліковий запис документа
            widget: string
            required: false
            hint: 'Наприклад: №CPRPP2024/15. Саме за цим номером педагоги себе шукають.'
          - name: issued
            label: Дата видачі документа
            widget: string
            required: false
            hint: 'Як у документі: 22.03.2024р.'
          - name: form
            label: Форма — якщо відрізняється
            widget: select
            required: false
            options:
              - Офлайн
              - Онлайн
              - Змішана (онлайн + офлайн)
            hint: Лишіть порожнім — візьметься форма заходу.
          - name: volume
            label: Обсяг — якщо відрізняється
            widget: string
            required: false
            hint: Лишіть порожнім — візьметься обсяг заходу.
          - name: result
            label: Результат — якщо відрізняється
            widget: text
            required: false
            hint: Лишіть порожнім — візьметься результат заходу.

  # ─────────────── КОМАНДА ───────────────
  - name: plany
    label: Плани роботи
    label_singular: План на місяць
    # Лапки обов'язкові: у тексті є двокрапка, без них YAML ламається.
    description: 'Один запис — один місяць. На сторінці «Плани роботи» місяці збираються самі: найновіший рік угорі, всередині року — від січня. № з/п сайт нумерує сам.'
    folder: content/plany
    create: true
    slug: 'plan-{{year}}-{{month}}'
    identifier_field: title
    sortable_fields: [date, title]
    summary: '{{title}}'
    view_groups:
      - { label: Рік, field: date, pattern: '\d{4}' }
    editor:
      preview: false
    fields:
      - name: title
        label: Місяць
        widget: string
        hint: 'Так, як побачить відвідувач: лютий 2026 року'
      - name: date
        label: Дата для впорядкування
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        # Обов'язкова: з неї Decap будує ім'я файлу plan-РРРР-ММ, і за нею місяць
        # потрапляє на сторінку свого року. Без дати файл став би «plan--».
        required: true
        hint: Перше число цього місяця. За нею список стає в правильному порядку.
      - name: entries
        label: Заходи
        label_singular: Захід
        widget: list
        required: false
        summary: "{{fields.event | default('Підпис під таблицею')}} — {{fields.date}}"
        hint: Один рядок — один захід. Порядок змінюється перетягуванням, № з/п сайт малює сам.
        fields:
          # Необов'язкове свідомо: 60 рядків у планах 2021-2022 — це підписи під
          # таблицею («Директор ЦПРПП …»), де заповнено лише поле «Підпис».
          # З required: true редактор не зберіг би такий місяць, не вигадавши назву заходу.
          - name: event
            label: Назва заходу
            widget: text
            required: false
            hint: Порожнім лишають тільки для рядка-підпису під таблицею.
          - name: date
            label: Дата проведення
            widget: string
            required: false
            hint: 'Як у плані: 01-09 лютого 2026 року або «Протягом місяця»'
          - { name: responsible, label: Відповідальний, widget: string, required: false }
          - name: note
            label: Підпис на всю ширину рядка
            widget: text
            required: false
            hint: Для підписів під таблицею («В.о.директора ЦПРПП …»). Такий рядок не нумерується.

  - name: team
    label: Команда
    label_singular: Працівник
    description: Показується на головній сторінці та на сторінці «Наша команда».
    folder: content/team
    create: true
    slug: '{{slug}}'
    identifier_field: name
    sortable_fields: [order, name]
    summary: '{{order}}. {{name}} — {{position}}'
    fields:
      - { name: name, label: 'Прізвище, ім’я, по батькові', widget: string }
      - { name: position, label: Посада, widget: string }
      - { name: photo, label: Фото, widget: image, required: false }
      - { name: order, label: Порядок у списку, widget: number, default: 10, value_type: int, hint: 'Менше число — вище у списку' }
      - { name: body, label: Про працівника, widget: markdown, required: false }

  # ─────────────── НАЛАШТУВАННЯ ───────────────
  - name: settings
    label: Налаштування сайту
    description: Контакти, графік роботи, партнери та меню.
    files:
      - name: site
        label: Контакти й загальне
        file: content/settings/site.yml
        fields:
          - { name: site_name, label: Повна назва установи, widget: string }
          - { name: site_short_name, label: Коротка назва, widget: string, hint: Показується у футері }
          - { name: site_description, label: Опис сайту, widget: text, hint: Показується у футері та в результатах пошуку Google }
          - name: logo
            label: Знак у шапці
            widget: image
            required: false
            hint: Герб міста. Показується розміром 44 px, тому дрібні деталі буде погано видно
          - name: logo_emblem
            label: Емблема Центру
            widget: image
            required: false
            hint: Емблема з назвою та гаслом. Показується на головній сторінці та у футері
          - name: team_photo
            label: Спільне фото команди
            widget: image
            required: false
            hint: Показується вгорі сторінки «Наша команда». Якщо фото немає — сторінка почнеться одразу з карток працівників.
          - name: team_caption
            label: Підпис під спільним фото
            widget: text
            required: false
            hint: 'Короткий текст про команду. Показується під спільним фото на сторінці «Наша команда». Абзаци розділяйте порожнім рядком. Щоб прибрати підпис — очистіть поле.'
          - name: team_caption_heading
            label: Заголовок підпису
            widget: string
            required: false
            hint: "Необов'язковий. Наприклад: Ми — ваші партнери, ментори та однодумці."
          - name: tagline
            label: Гасло
            widget: list
            required: false
            label_singular: Слово
            summary: '{{fields.word}}'
            collapsed: false
            hint: По одному слову в рядку — між ними сайт сам поставить ромби
            field: { name: word, label: Слово, widget: string }
          - { name: address, label: Адреса, widget: string, required: false }
          - { name: map_url, label: Посилання на мапу, widget: string, required: false }
          - name: phones
            label: Телефони
            widget: list
            required: false
            label_singular: Телефон
            summary: '{{fields.phone}}'
            collapsed: false
            field: { name: phone, label: Телефон, widget: string }
          - { name: email, label: Електронна пошта, widget: string, required: false }
          - name: consultation_url
            label: Посилання на запис на консультацію
            widget: string
            required: false
            hint: Кнопка у шапці сайту. Якщо лишити порожнім — кнопки не буде.
          - name: facebook_url
            label: Посилання на Фейсбук
            widget: string
            required: false
            hint: Група Центру у Facebook. Показується у футері біля контактів. Щоб прибрати — очистіть поле.
          - name: announcement
            label: Оголошення на всьому сайті
            widget: string
            required: false
            hint: 'Смуга вгорі кожної сторінки. Наприклад: 14 серпня Центр не працює. Щоб прибрати смугу — очистіть це поле.'
          - name: announcement_url
            label: Посилання в оголошенні
            widget: string
            required: false
            hint: Необов'язкове. Якщо вказати — текст оголошення стане посиланням (наприклад на новину з деталями).
          - name: schedule
            label: Графік роботи
            widget: list
            required: false
            summary: '{{fields.days}} {{fields.hours}}'
            fields:
              - { name: days, label: Дні, widget: string, hint: 'Наприклад: Пн–Чт' }
              - { name: hours, label: Години, widget: string, hint: 'Наприклад: 8:00 – 17:00' }
          - name: partners
            label: Партнери
            widget: list
            required: false
            label_singular: Партнер
            summary: '{{fields.name}}'
            hint: Блок «Ми співпрацюємо» на головній сторінці
            fields:
              - { name: name, label: Назва організації, widget: string }
              - { name: image, label: Логотип, widget: image, required: false }
              - { name: url, label: Сайт організації, widget: string, required: false }
      - name: navigation
        label: Головне меню
        file: content/settings/navigation.yml
        fields:
          - name: sections
            label: Розділи меню
            label_singular: Розділ
            widget: list
            summary: '{{fields.title}}'
            hint: Порядок розділів тут — це порядок у меню сайту
            fields:
              - { name: title, label: Назва розділу, widget: string }
              - name: items
                label: Пункти
                label_singular: Пункт
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Назва пункту, widget: string }
                  - name: url
                    label: Куди веде
                    widget: string
                    hint: Адреса сторінки, наприклад /atestatsiia. Її видно в рядку браузера, коли відкрити цю сторінку на сайті.
